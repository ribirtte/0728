    const downloadCardEl = document.getElementById('downloadCard');
    const higgsfieldKey1El = document.getElementById('higgsfieldKey1');
    const higgsfieldKey2El = document.getElementById('higgsfieldKey2');

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        birthDate: birthDateEl.value,
        name: nameEl.value,
        question: questionEl.value
      }));
    }

    function parseBirthDate(value) {
      if (!value) return null;
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function getZodiacByDate(month, day) {
      const value = month * 100 + day;
      for (const sign of ZODIAC_SIGNS) {
        const start = sign.start[0] * 100 + sign.start[1];
        const end = sign.end[0] * 100 + sign.end[1];
        if (start <= end) {
          if (value >= start && value <= end) return sign;
        } else if (value >= start || value <= end) {
          return sign;
        }
      }
      return ZODIAC_SIGNS[0];
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      }).format(date);
    }

    function uniqueSortedNumbers(numbers) {
      return [...new Set(numbers)]
        .filter((n) => Number.isInteger(n) && n >= 1 && n <= 45)
        .slice(0, 6)
        .sort((a, b) => a - b);
    }

    function deriveNumbers(date, sign) {
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const year = date.getFullYear();
      const yearSum = String(year).split('').reduce((sum, digit) => sum + Number(digit), 0);

      const candidate1 = ((month * day) % 45) + 1;
      const candidate2 = ((month + day + yearSum) % 45) + 1;
      const candidate3 = sign.lucky[(month + day) % sign.lucky.length];
      const candidate4 = sign.lucky[(month * 2 + day) % sign.lucky.length];
      const candidate5 = year % 45 || 45;
      const candidate6 = (((month + yearSum) * day) % 45) + 1;

      const numbers = uniqueSortedNumbers([candidate1, candidate2, candidate3, candidate4, candidate5, candidate6]);
      while (numbers.length < 6) {
        const seed = numbers.reduce((sum, n) => sum + n, 0) + yearSum;
        let next = (seed % 45) + 1;
        if (numbers.includes(next)) next = ((next + 6) % 45) + 1;
        if (!numbers.includes(next)) numbers.push(next);
      }
      return numbers.sort((a, b) => a - b);
    }

    function buildConstellationSvg(sign) {
      const points = CONSTELLATIONS[sign.key] || CONSTELLATIONS.aries;
      const path = points.map(([x, y]) => `${x},${y}`).join(' ');
      const dots = points.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.8" fill="${sign.color}" />`).join('');
      return `
        <svg viewBox="0 0 200 120" role="img" aria-label="${sign.name} 蹂꾩옄由?紐⑥뼇">
          <rect width="200" height="120" fill="#eef4ff"></rect>
          <polyline points="${path}" fill="none" stroke="${sign.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>
          ${dots}
        </svg>
      `;
    }

          <circle cx="600" cy="360" r="310" fill="none" />
          <circle cx="600" cy="360" r="230" fill="none" />

        <g opacity="0.3" fill="#fff">
          <circle cx="160" cy="140" r="6" />
          <circle cx="236" cy="260" r="4" />
          <circle cx="960" cy="180" r="5" />
          <circle cx="1020" cy="336" r="7" />
          <circle cx="890" cy="1200" r="5" />

        <rect x="70" y="70" width="1060" height="1460" rx="36" fill="rgba(255,255,255,0.23)" stroke="rgba(255,255,255,0.32)" />

        <text x="110" y="150" font-size="28" font-weight="800" letter-spacing="3" fill="#23313f">BIRTHDATE CARD</text>
        <text x="110" y="210" font-size="98" font-weight="900" fill="#18232f">${title}</text>
        <text x="110" y="260" font-size="28" font-weight="700" fill="#4b5b6b">${subtitle}</text>

        <g transform="translate(680, 150)" filter="url(#shadow)">

          <circle cx="220" cy="220" r="160" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="3" />
          <circle cx="220" cy="220" r="120" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="3" />
          <circle cx="220" cy="220" r="88" fill="rgba(255,255,255,0.16)" />
          <text x="220" y="260" text-anchor="middle" font-size="170" font-weight="900" fill="#111827">${sign.glyph}</text>
        </g>

        <g transform="translate(120, 410)">
          <rect width="960" height="420" rx="34" fill="rgba(17,28,41,0.82)" stroke="rgba(255,255,255,0.12)" />
          <text x="44" y="70" font-size="26" font-weight="800" fill="#f6d57a">CONSTELLATION</text>
          <text x="44" y="112" font-size="60" font-weight="900" fill="#f5f1e8">${sign.name}</text>
          <text x="44" y="162" font-size="24" fill="#c9d4e3">${profile.dateLabel}</text>
          <text x="44" y="206" font-size="22" fill="#c9d4e3">?먯냼: ${sign.element}</text>
          <g transform="translate(520, 38)">
            <rect width="390" height="280" rx="28" fill="#eef4ff" />
            <polyline points="${path}" fill="none" stroke="${accent}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
            ${dots}
          </g>
        </g>

        <g transform="translate(110, 880)">
          <text x="0" y="0" font-size="30" font-weight="800" fill="#23313f">LUCKY NUMBERS</text>
          ${numberChips}
        </g>

        <g transform="translate(110, 1095)">
          <rect width="980" height="250" rx="30" fill="rgba(255,255,255,0.22)" />
          <text x="34" y="58" font-size="28" font-weight="800" fill="#18232f">Why these numbers?</text>
          <text x="34" y="108" font-size="22" fill="#304050">${hint || '?앸뀈?붿씪???먮쫫怨?蹂꾩옄由?怨좎쑀???⑦꽩???욎뼱??戮묒븯?듬땲??'}</text>
          <text x="34" y="154" font-size="22" fill="#304050">??移대뱶??寃곌낵瑜???ν븯嫄곕굹 怨듭쑀?섍린 醫뗪쾶 留뚮뱺 誘몃━蹂닿린?낅땲??</text>
          <text x="34" y="205" font-size="22" fill="#304050">Model note: local visual renderer fallback.</text>
        </g>
      </svg>`;

    function svgToDataUrl(svg) {
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function renderCard(profile, explanation, cardImageUrl = '') {
      const svg = buildCardSvg(profile, explanation);
      const fallbackUrl = svgToDataUrl(svg);
      const finalUrl = cardImageUrl || fallbackUrl;
      cardPreviewEl.src = finalUrl;
      downloadCardEl.href = finalUrl;
      downloadCardEl.download = cardImageUrl ? 'zodiac-card.png' : 'zodiac-card.svg';
    }

    function renderNumbers(numbers) {
      numbersEl.innerHTML = '';
      numbers.forEach((number, index) => {
        const div = document.createElement('div');
        div.className = ['ball', 'ball alt', 'ball blue', 'ball red', 'ball violet', 'ball'][index % 6];
        div.textContent = number;
        numbersEl.appendChild(div);
      });
    }

    function renderBase(profile) {
      zodiacGlyphEl.textContent = profile.sign.glyph;
      zodiacNameEl.textContent = profile.sign.name;
      zodiacMetaEl.textContent = `${profile.dateLabel}\n?먯냼: ${profile.sign.element}`;
      constellationEl.innerHTML = buildConstellationSvg(profile.sign);
      renderNumbers(profile.numbers);
      resultMetaEl.textContent = `${profile.numbers.length}개`;
      renderCard(profile, '');
    }

    function getAnalysisClickCount() {
      const raw = Number(localStorage.getItem('zodiac-analysis-click-count') || '0');
      return Number.isFinite(raw) ? raw : 0;
    }

    function bumpAnalysisClickCount() {
      const next = getAnalysisClickCount() + 1;
      localStorage.setItem('zodiac-analysis-click-count', String(next));
      return next;
    }

    function trackGaEvent(action, label, count) {
      if (typeof window.gtag === 'function') {
        window.gtag('event', action, {
          event_category: 'engagement',
          event_label: label,
          click_count: count,
          value: count
        });
      }
    }

    function analyzeLocal() {
      const date = parseBirthDate(birthDateEl.value);
      if (!date) return null;
      const sign = getZodiacByDate(date.getMonth() + 1, date.getDate());
      const numbers = deriveNumbers(date, sign);
      return {
        date,
        sign,
        numbers,
        dateLabel: formatDate(date),
        name: nameEl.value.trim()
      };
    }

    function localExplanation(profile) {
      const prefix = profile.name ? `${profile.name}?? ` : '';
      return [
        `${prefix}${profile.sign.name} 湲곗슫?쇰줈 ?쎌뿀?듬땲??`,
        `蹂꾩옄由?紐⑥뼇? ${profile.sign.name}???먮쫫???쒓컖?뷀뻽怨? 異붿쿇 踰덊샇???앸뀈?붿씪???????곕룄 ?⑷낵 ${profile.sign.name}??怨좎쑀 lucky set???욎뼱 以묐났???쒓굅??媛믪엯?덈떎.`,
        `踰덊샇媛 ?쒖そ?쇰줈 移섏슦移섏? ?딅룄濡?蹂댁젙?섍퀬, ?먯냼 ?뱀꽦???욎뼱 ?ㅻ챸???먯뿰?ㅻ읇寃?蹂댁씠?꾨줉 留뚮뱾?덉뒿?덈떎.`
      ].join('\n');
    }

    async function analyze() {
      const profile = analyzeLocal();
      if (!profile) {
        statusEl.textContent = '생년월일을 먼저 입력하세요.';
        return;
      }

      renderBase(profile);
      const question = questionEl.value.trim();
      analyzeBtn.disabled = true;
      resetBtn.disabled = true;
      statusEl.textContent = '초기화 완료';
      explanationEl.textContent = '?묐떟???앹꽦 以묒엯?덈떎.';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            birthDate: birthDateEl.value,
            name: nameEl.value.trim(),
            question: question || '???앸뀈?붿씪??蹂꾩옄由ъ? 異붿쿇 踰덊샇瑜?吏㏐퀬 ?먯뿰?ㅻ읇寃??ㅻ챸?댁쨾.'
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data?.error || 'OpenAI ?몄텧???ㅽ뙣?덉뒿?덈떎.');

        const resultProfile = data.profile || {};
        const matchedSign = ZODIAC_SIGNS.find((item) => item.key === resultProfile.signKey) || profile.sign;
        const numbers = Array.isArray(resultProfile.numbers) && resultProfile.numbers.length
          ? resultProfile.numbers
          : profile.numbers;

        const nextProfile = {
          ...profile,
          sign: matchedSign,
          numbers
        };
        renderBase(nextProfile);
        if (resultProfile.constellationSvg) {
          constellationEl.innerHTML = resultProfile.constellationSvg;
        }

        const explanation = typeof data.explanation === 'string' && data.explanation.trim()
          ? data.explanation
          : localExplanation(nextProfile);
        explanationEl.textContent = explanation;
        renderCard(nextProfile, explanation);
        statusEl.textContent = '초기화 완료';
      } catch (error) {
        const fallback = `OpenAI ?곌껐 ?ㅽ뙣: ${error.message}\n\n${localExplanation(profile)}`;
        explanationEl.textContent = fallback;
        renderCard(profile, fallback);
        statusEl.textContent = '초기화 완료';
      } finally {
        analyzeBtn.disabled = false;
        resetBtn.disabled = false;
        saveState();
      }
    }

    async function analyzeEnhanced() {
      const profile = analyzeLocal();
      if (!profile) {
        statusEl.textContent = '초기화 완료';
        return;
      }

      renderBase(profile);
      const question = questionEl.value.trim();
      const higgsfieldApiKey = higgsfieldKey1El.value.trim();
      const higgsfieldApiSecret = higgsfieldKey2El.value.trim();
      if (!higgsfieldApiKey || !higgsfieldApiSecret) {
        statusEl.textContent = 'Soul2 API Key와 Secret을 먼저 입력하세요.';
        explanationEl.textContent = '?대?吏瑜?留뚮뱾?ㅻ㈃ ???덉뿉 ??2媛쒕? ?ｌ뼱???⑸땲??';
        return;
      }
      analyzeBtn.disabled = true;
      resetBtn.disabled = true;
      statusEl.textContent = 'OpenAI와 Soul2를 호출하는 중...';
      explanationEl.textContent = '?ㅻ챸怨?移대뱶 ?대?吏瑜??숈떆???앹꽦?섍퀬 ?덉뒿?덈떎.';

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            birthDate: birthDateEl.value,
            name: nameEl.value.trim(),
            question: question || '?앸뀈?붿씪 湲곕컲?쇰줈 蹂꾩옄由ъ? 異붿쿇 踰덊샇瑜??ㅻ챸?댁쨾.',
            higgsfieldApiKey,
            higgsfieldApiSecret
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data?.error || '?쒕쾭 ?몄텧???ㅽ뙣?덉뒿?덈떎.');

        const resultProfile = data.profile || {};
        const matchedSign = ZODIAC_SIGNS.find((item) => item.key === resultProfile.signKey) || profile.sign;
        const numbers = Array.isArray(resultProfile.numbers) && resultProfile.numbers.length
          ? resultProfile.numbers
          : profile.numbers;

        const nextProfile = {
          ...profile,
          sign: matchedSign,
          numbers
        };
        renderBase(nextProfile);
        if (resultProfile.constellationSvg) {
          constellationEl.innerHTML = resultProfile.constellationSvg;
        }

        const explanation = typeof data.explanation === 'string' && data.explanation.trim()
          ? data.explanation
          : localExplanation(nextProfile);
        explanationEl.textContent = explanation;
        renderCard(nextProfile, explanation, resultProfile.cardImageUrl || '');
        statusEl.textContent = resultProfile.cardImageUrl
          ? '?ㅻ챸怨?移대뱶 ?대?吏瑜?諛쏆븯?듬땲??'
          : '?ㅻ챸? 諛쏆븯怨?移대뱶 ?대?吏??濡쒖뺄濡??泥댄뻽?듬땲??';
      } catch (error) {
        const fallback = `연결 실패: ${error.message}\n\n${localExplanation(profile)}`;
        explanationEl.textContent = fallback;
        renderCard(profile, fallback);
        statusEl.textContent = '로컬 카드로 대체했습니다.';
      } finally {
        analyzeBtn.disabled = false;
        resetBtn.disabled = false;
        saveState();
      }
    }

    function resetAll() {
      birthDateEl.value = '';
      nameEl.value = '';
      questionEl.value = '';
      higgsfieldKey1El.value = '';
      higgsfieldKey2El.value = '';
      zodiacGlyphEl.textContent = '?';
      zodiacNameEl.textContent = '생년월일을 입력하면 표시됩니다.';
      zodiacMetaEl.textContent = '?앸뀈?붿씪???ｊ퀬 遺꾩꽍???꾨Ⅴ?몄슂.';
      constellationEl.innerHTML = '';
      numbersEl.innerHTML = '';
      resultMetaEl.textContent = '0개';
      explanationEl.textContent = '?꾩쭅 遺꾩꽍 ?꾩엯?덈떎.';
      cardPreviewEl.removeAttribute('src');
      downloadCardEl.href = '#';
      statusEl.textContent = '초기화 완료';
      saveState();
    }

    const state = loadState();
    if (state.birthDate) birthDateEl.value = state.birthDate;
    if (state.name) nameEl.value = state.name;
    if (state.question) questionEl.value = state.question;
    if (birthDateEl.value) {
      const profile = analyzeLocal();
      if (profile) renderBase(profile);
    }

    analyzeBtn.addEventListener('click', () => {
      const clickCount = bumpAnalysisClickCount();
      trackGaEvent('zodiac_analysis_click', '별자리 분석 버튼', clickCount);
      analyzeEnhanced();
    });
    resetBtn.addEventListener('click', resetAll);
    [birthDateEl, nameEl, questionEl].forEach((el) => {
      el.addEventListener('input', saveState);
      el.addEventListener('change', saveState);
    });

    questionEl.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        analyzeEnhanced();
      }
    });

    statusEl.textContent = location.protocol === 'file:'
      ? '?뚯씪濡??댁뿀?듬땲?? server.ps1??癒쇱? ?ㅽ뻾?섏꽭??'
      : '以鍮??꾨즺';
  </script>
